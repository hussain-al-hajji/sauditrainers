# يولّد صفحات مشاركة المدربين (معاينة الروابط في واتساب وإكس ولينكدإن) وصور بطاقاتهم، ويحدّثها كل ساعة وعند أي تعديل في الكود.
# التشغيل اليدوي: تبويب Actions ← «صفحات مشاركة المدربين» ← Run workflow
name: صفحات مشاركة المدربين
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths: ['js/card.js', 'js/data.js', 'tools/og/**', '.github/workflows/share-pages.yml']
permissions:
  contents: write
concurrency:
  group: share-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: هل تغيّر شيء؟ (دون تثبيت أي حزمة)
        id: chk
        run: node tools/og/build.js --check
      - name: تثبيت المتصفح
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save playwright@1.49
          npx playwright install --with-deps chromium
      - name: توليد الصور والصفحات
        if: steps.chk.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: node tools/og/build.js
      - name: حفظ التغييرات
        run: |
          git config user.name "sauditrainers-bot"
          git config user.email "bot@users.noreply.github.com"
          git add t og sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "تحديث صفحات مشاركة المدربين [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

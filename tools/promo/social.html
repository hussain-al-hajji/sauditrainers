:root{--g950:#001A0E;--g900:#002E1A;--g800:#005430;--g700:#0B6A3E;--g600:#138550;--g500:#23A365;--g300:#86D3AC;--cream:#EEF3E5;--sage:#C9DAB4;--ink:#0D2418}
*{box-sizing:border-box;margin:0}
body{background:#222;display:grid;gap:40px;justify-content:center;padding:40px}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;direction:rtl;font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;color:#fff;
  background:radial-gradient(1000px 760px at 85% -5%,#16905a 0%,transparent 62%),radial-gradient(800px 600px at 5% 105%,#0a6b3e 0%,transparent 60%),linear-gradient(165deg,#00623A,#002E1A 55%,#001A0E)}
.post.light{background:radial-gradient(900px 700px at 90% 0%,#ffffff 0%,transparent 60%),linear-gradient(165deg,#EEF3E5,#DCE8D0);color:var(--ink)}
.post::before{content:'';position:absolute;inset:0;background:var(--pat);background-size:420px;opacity:.85}
.frame{position:absolute;inset:36px;border:3px solid rgba(238,243,229,.78);border-radius:44px;pointer-events:none}
.frame::after{content:'';position:absolute;inset:14px;border:1.5px solid rgba(238,243,229,.28);border-radius:32px}
.light .frame{border-color:rgba(0,84,48,.7)}.light .frame::after{border-color:rgba(0,84,48,.25)}
.top{position:absolute;top:78px;inset-inline:100px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.top img{height:92px}
.kick{font-family:'Cairo';font-weight:800;font-size:28px;padding:10px 26px;border-radius:999px;background:rgba(238,243,229,.13);border:1.5px solid rgba(238,243,229,.4);letter-spacing:.01em}
.light .kick{background:rgba(0,84,48,.08);border-color:rgba(0,84,48,.35);color:var(--g800)}
.body{position:absolute;inset-inline:100px;top:215px;bottom:230px;z-index:2;display:flex;flex-direction:column}
h1{font-family:'Cairo';font-weight:900;font-size:112px;line-height:1.28;letter-spacing:-.01em}
h1 .acc{display:block;background:linear-gradient(100deg,#C9DAB4,#ffffff 45%,#C9DAB4);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.12em}
.light h1 .acc{background:linear-gradient(100deg,#005430,#0B6A3E);-webkit-background-clip:text;background-clip:text}
h2{font-family:'Cairo';font-weight:900;font-size:86px;line-height:1.3}
.sub{font-size:38px;line-height:1.75;font-weight:500;color:rgba(238,243,229,.86);margin-top:26px;max-width:860px}
.light .sub{color:#2c4a39}
.foot{position:absolute;left:62px;right:62px;bottom:62px;height:150px;border-radius:30px;background:linear-gradient(#023220,#001a0e);border:1.5px solid rgba(238,243,229,.2);z-index:5!important;display:flex;align-items:center;justify-content:space-between;padding:0 48px;z-index:2}
.light .foot{background:rgba(0,84,48,.09)}
.foot .lead{font-size:26px;font-weight:600;color:rgba(238,243,229,.85);line-height:1.5}
.light .foot .lead{color:#2c4a39}
.foot .line{display:flex;align-items:center;gap:20px;margin-top:4px;direction:rtl}
.foot b{font-family:'Cairo';font-weight:900;font-size:42px;color:var(--sage)}
.light .foot b{color:var(--g800)}
.foot i.sep{font-style:normal;font-size:40px;opacity:.5}
.foot em{font-style:normal;font-family:'Cairo';font-weight:700;font-size:34px;direction:ltr;color:rgba(238,243,229,.92)}
.light .foot em{color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:16px;font-family:'Cairo';font-weight:900;font-size:40px;color:var(--g800);background:linear-gradient(135deg,#fff,#EEF3E5);padding:22px 48px;border-radius:999px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55)}
.light .cta{color:#fff;background:linear-gradient(135deg,#138550,#005430)}
.card{border-radius:34px;box-shadow:0 40px 70px -24px rgba(0,0,0,.6),0 0 0 2px rgba(238,243,229,.35)}
/* 1: hero */
.fan{position:absolute;inset-inline:0;bottom:120px;height:620px;z-index:1}
.fan img{position:absolute;width:430px;border-radius:30px;box-shadow:0 40px 70px -24px rgba(0,0,0,.65),0 0 0 2px rgba(238,243,229,.4)}
.fan .c1{left:50%;margin-left:-215px;bottom:-30px;transform:rotate(0deg);z-index:3}
.fan .c2{left:50%;margin-left:-470px;bottom:-60px;transform:rotate(-9deg);z-index:2}
.fan .c3{left:50%;margin-left:40px;bottom:-60px;transform:rotate(9deg);z-index:2}
/* 2: benefits */
.ben{display:grid;gap:12px;margin-top:28px}
.ben div{display:flex;align-items:center;gap:24px;padding:14px 26px;border-radius:26px;background:rgba(238,243,229,.1);border:1.5px solid rgba(238,243,229,.22)}
.ben .ic{flex:none;width:68px;height:68px;border-radius:20px;background:var(--cream);color:var(--g800);display:grid;place-items:center;font-size:30px}
.ben h3{font-family:'Cairo';font-weight:800;font-size:35px;line-height:1.3}
.ben p{font-size:24px;color:rgba(238,243,229,.8);line-height:1.5;margin-top:2px}
.price{margin-top:24px;display:flex;align-items:center;justify-content:space-between;padding:18px 36px;border-radius:28px;background:linear-gradient(135deg,#EEF3E5,#C9DAB4);color:var(--g800)}
.price strong{font-family:'Cairo';font-weight:900;font-size:66px;line-height:1}
.price span{font-family:'Cairo';font-weight:800;font-size:34px;line-height:1.4}
/* 3: steps */
.search{margin-top:26px;background:#fff;color:#5b7566;border-radius:999px;padding:26px 44px;font-size:34px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 20px 44px -16px rgba(0,0,0,.5)}
.search i{color:var(--g600)}.search .go{background:linear-gradient(135deg,#EEF3E5,#C9DAB4);color:var(--g800);font-family:'Cairo';font-weight:900;border-radius:999px;padding:12px 34px;font-size:30px}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.chips span{padding:10px 24px;border-radius:999px;font-size:26px;font-weight:600;background:rgba(238,243,229,.12);border:1.5px solid rgba(238,243,229,.3)}
.steps{display:grid;gap:16px;margin-top:30px}
.steps div{display:flex;gap:26px;align-items:center}
.steps .n{flex:none;width:74px;height:74px;border-radius:50%;background:var(--cream);color:var(--g800);font-family:'Cairo';font-weight:900;font-size:40px;display:grid;place-items:center;box-shadow:0 0 0 7px rgba(238,243,229,.16)}
.steps h3{font-family:'Cairo';font-weight:800;font-size:36px;line-height:1.3}.steps p{font-size:24px;color:rgba(238,243,229,.8)}
/* 4: numbers */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px}
.nums div{padding:16px 22px;border-radius:34px;background:rgba(238,243,229,.1);border:1.5px solid rgba(238,243,229,.26);text-align:center}
.nums b{display:block;font-family:'Cairo';font-weight:900;font-size:104px;line-height:1.1;background:linear-gradient(180deg,#fff,#C9DAB4);-webkit-background-clip:text;background-clip:text;color:transparent}
.nums span{font-family:'Cairo';font-weight:800;font-size:38px;color:var(--cream)}
.nums small{display:block;font-size:24px;color:rgba(238,243,229,.72);margin-top:4px}
/* 5: zero */
.zero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.zero .big{font-family:'Cairo';font-weight:900;font-size:430px;line-height:1;background:linear-gradient(180deg,#fff,#C9DAB4);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 26px 40px rgba(0,0,0,.35));padding:0 20px}
.zero h2{font-size:78px;margin-top:-10px}.zero p{font-size:36px;line-height:1.8;color:rgba(238,243,229,.86);margin-top:26px;max-width:800px}
.ring{position:absolute;border:2px dashed rgba(238,243,229,.3);border-radius:50%}
/* 6: card anatomy */
.anat{position:relative;flex:1}
.anat .card{position:absolute;width:520px;left:50%;margin-left:-260px;top:10px}
.call{position:absolute;display:flex;align-items:center;gap:14px;font-family:'Cairo';font-weight:800;font-size:32px;background:var(--cream);color:var(--g800);padding:12px 26px;border-radius:999px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);z-index:3}
.call i{font-size:28px}
.soc{display:flex;gap:18px;margin-top:20px}
.soc span{width:76px;height:76px;border-radius:24px;background:rgba(238,243,229,.12);border:1.5px solid rgba(238,243,229,.3);display:grid;place-items:center;font-size:36px}

/* ====== صور إعلام المدربين بتحديث المنصة: ألوان الهوية ====== */
.post.t-deep{background:radial-gradient(900px 700px at 15% -5%,#0b6a3e 0%,transparent 60%),linear-gradient(165deg,#003d23,#001a0e 70%)}
.post.t-olive{background:radial-gradient(900px 700px at 85% 0%,#6E9142 0%,transparent 62%),linear-gradient(165deg,#3B5420,#1E2C10)}
.post.light{background:radial-gradient(900px 700px at 90% 0%,#fff 0%,transparent 60%),linear-gradient(165deg,#EEF3E5,#D5E4C4)}
.post.light::before{background:var(--patd);background-size:420px}
.light .top img{content:url(/assets/logo-green.png)}
.light .cta{color:#fff}
.light .card,.light .shot{box-shadow:0 36px 60px -26px rgba(0,40,20,.5),0 0 0 2px rgba(0,84,48,.2)}
.t-olive .foot{background:linear-gradient(#26380F,#16200A)}
.light .foot{background:linear-gradient(#005430,#003d23);border-color:transparent}
.light .foot .lead{color:rgba(238,243,229,.85)}.light .foot b{color:#C9DAB4}.light .foot em{color:#fff}
.light h2,.light h1{color:#003d23}
.panel{border-radius:28px;background:rgba(238,243,229,.1);border:1.5px solid rgba(238,243,229,.26)}
.light .panel{background:#fff;border-color:rgba(0,84,48,.2);box-shadow:0 20px 40px -24px rgba(0,40,20,.4)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.tiles>div{padding:28px 26px;border-radius:28px;background:rgba(238,243,229,.1);border:1.5px solid rgba(238,243,229,.26)}
.tiles .ic{width:68px;height:68px;border-radius:20px;background:var(--cream);color:var(--g800);display:grid;place-items:center;font-size:31px;flex:none}.tiles .hd{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.tiles h3{font-family:'Cairo';font-weight:800;font-size:35px;line-height:1.3}.tiles p{font-size:25px;line-height:1.5;opacity:.82;margin-top:4px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}
.vs>div{padding:28px 28px 22px;border-radius:32px}
.vs .old{background:rgba(0,0,0,.22);border:2px dashed rgba(238,243,229,.3);color:rgba(238,243,229,.7)}
.vs .new{background:linear-gradient(160deg,#EEF3E5,#C9DAB4);color:var(--g800);box-shadow:0 30px 50px -22px rgba(0,0,0,.6)}
.vs h3{font-family:'Cairo';font-weight:900;font-size:40px;margin-bottom:14px}
.vs li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-size:27px;font-weight:600;line-height:1.5;padding:7px 0}
.vs .old li i{color:#d98a8a}.vs .new li i{color:var(--g600)}
.vs small{display:block;font-size:22px;opacity:.7;margin-bottom:8px;font-weight:500}
.browser{border-radius:26px;overflow:hidden;background:#F6F9F1;color:var(--ink);box-shadow:0 40px 70px -26px rgba(0,0,0,.7),0 0 0 2px rgba(238,243,229,.3)}
.browser .bar{height:54px;background:#DDE8D0;display:flex;align-items:center;gap:9px;padding:0 20px;direction:ltr}
.browser .bar i{width:15px;height:15px;border-radius:50%;background:#9db38a}
.browser .bar span{margin-inline-start:16px;flex:1;background:#fff;border-radius:999px;padding:6px 20px;font:600 21px 'Cairo';color:#5b7566}
.dash{display:flex;min-height:500px}
.dash aside{width:270px;background:linear-gradient(#003d23,#001a0e);color:#fff;padding:24px 18px;display:grid;gap:10px;align-content:start}
.dash aside .me{display:flex;gap:12px;align-items:center;margin-bottom:12px;font:800 23px 'Cairo'}
.dash aside .me i{width:50px;height:50px;border-radius:50%;background:var(--cream);color:var(--g800);display:grid;place-items:center;font-size:24px}
.dash aside b{font:700 25px 'Cairo';padding:14px 16px;border-radius:16px;display:flex;gap:12px;align-items:center;opacity:.8}
.dash aside b.on{background:rgba(238,243,229,.18);opacity:1}
.dash aside b em{margin-inline-start:auto;font-style:normal;background:#EEF3E5;color:var(--g800);border-radius:999px;padding:0 12px;font-size:21px}
.dash main{flex:1;padding:28px;display:grid;gap:16px;align-content:start}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kp div{border-radius:20px;background:#fff;border:1.5px solid #d5e2c8;padding:16px;text-align:center}
.kp b{display:block;font:900 52px/1.1 'Cairo';color:var(--g800)}.kp span{font:700 21px 'Cairo';color:#4b6a58}
.fld{display:grid;gap:10px}
.fld div{background:#fff;border:1.5px solid #cddcbe;border-radius:16px;padding:12px 18px;font:600 23px 'IBM Plex Sans Arabic';color:#2c4a39;display:flex;justify-content:space-between}
.fld small{font:700 19px 'Cairo';color:#7a9484}
.swatch{display:flex;gap:16px;justify-content:center;margin-top:24px}
.swatch i{width:58px;height:58px;border-radius:50%;box-shadow:0 0 0 4px rgba(238,243,229,.4)}
.pill{display:inline-flex;gap:12px;align-items:center;font:800 30px 'Cairo';padding:14px 28px;border-radius:999px;background:rgba(238,243,229,.14);border:1.5px solid rgba(238,243,229,.35)}
.light .pill{background:rgba(0,84,48,.08);border-color:rgba(0,84,48,.3);color:var(--g800)}
.notif{display:flex;gap:20px;align-items:center;padding:22px 26px;border-radius:28px;background:#fff;color:var(--ink);box-shadow:0 26px 46px -22px rgba(0,0,0,.6)}
.notif .ic{flex:none;width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#138550,#005430);color:#fff;display:grid;place-items:center;font-size:36px}
.notif b{font:800 31px 'Cairo';display:block}.notif span{font-size:24px;color:#4b6a58;line-height:1.5}.notif small{margin-inline-start:auto;font:600 20px 'Cairo';color:#8aa294;align-self:flex-start}
.reg{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.reg span{padding:11px 24px;border-radius:999px;font:700 26px 'Cairo';background:rgba(238,243,229,.12);border:1.5px solid rgba(238,243,229,.3)}
.reg span.on{background:var(--cream);color:var(--g800)}
.ctaw{display:flex;justify-content:center;margin-top:34px}

/* ===== أغلفة وصورة حسابات التواصل ===== */
.bg-brand{background:radial-gradient(900px 600px at 85% -10%,#16905a 0%,transparent 62%),radial-gradient(700px 500px at 0% 120%,#0a6b3e 0%,transparent 60%),linear-gradient(165deg,#00623A,#002E1A 60%,#001A0E)}
.cv{position:relative;overflow:hidden;direction:rtl;font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;color:#fff}
.cv::before{content:'';position:absolute;inset:0;background:var(--pat);background-size:360px;opacity:.9}
#x{width:1500px;height:500px}
#x .fr{position:absolute;inset:22px;border:2.5px solid rgba(238,243,229,.7);border-radius:30px}
#x .fr::after{content:'';position:absolute;inset:10px;border:1.5px solid rgba(238,243,229,.25);border-radius:22px}
#x .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-bottom:26px}
#x .mid img{height:104px}
#x h1{font-family:Cairo;font-weight:900;font-size:56px;line-height:1.3;margin:2px 0 0;white-space:nowrap}
#x h1 .acc{background:linear-gradient(100deg,#C9DAB4,#fff 45%,#C9DAB4);-webkit-background-clip:text;background-clip:text;color:transparent}
#x .url{display:inline-flex;gap:14px;align-items:center;margin-top:8px;font-family:'Cairo';font-weight:800;font-size:28px;padding:8px 30px;border-radius:999px;background:rgba(238,243,229,.14);border:1.5px solid rgba(238,243,229,.4)}
#x .url em{font-style:normal;direction:ltr}
#x .c{position:absolute;width:250px;border-radius:22px;box-shadow:0 30px 50px -20px rgba(0,0,0,.65),0 0 0 2px rgba(238,243,229,.4)}
#li{width:1128px;height:191px}
